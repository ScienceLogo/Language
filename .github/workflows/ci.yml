name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate citation metadata
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"

      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          distribution: full
          variant: CS
          version: "9.3"

      - name: Build Racket package archive
        run: raco pkg create --source --format zip --dest "$RUNNER_TEMP" "$GITHUB_WORKSPACE"

      - name: Install package archive
        run: raco pkg install --auto --batch --scope user --name sciencelogo "$RUNNER_TEMP"/*.zip

      - name: Run all installed package tests with Git
        run: |
          git --version
          raco test --jobs 2 --drdr --package sciencelogo

      - name: Test the installed package without Git
        shell: bash
        run: |
          racket_executable="$(command -v racket)"
          mkdir -p "$RUNNER_TEMP/without-git"
          PATH="$RUNNER_TEMP/without-git" "$racket_executable" -l- raco test --jobs 2 --drdr --package sciencelogo
