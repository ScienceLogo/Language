name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate citation metadata
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"

      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          distribution: full
          variant: CS
          version: "9.3"

      - name: Build Racket package archive
        run: raco pkg create --source --format zip --dest "$RUNNER_TEMP" "$GITHUB_WORKSPACE"

      - name: Install package archive
        run: raco pkg install --auto --batch --scope user "$RUNNER_TEMP"/*.zip

      - name: Run Racket tests
        run: raco test .
