name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "scribblings/**"
      - "info.rkt"
      - ".github/workflows/docs.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          distribution: full
          variant: CS
          version: "9.3"

      - name: Build HTML manual
        run: raco scribble --html ++style scribblings/pages.css --dest "$RUNNER_TEMP/site" --dest-name index.html scribblings/sciencelogo.scrbl

      - name: Prepare GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload HTML manual
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy HTML manual
        id: deployment
        uses: actions/deploy-pages@v5
