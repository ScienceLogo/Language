name: Prepare release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.1
        required: true
        type: string
      source_ref:
        description: Source commit or branch for an explicit package rebuild
        required: false
        type: string
      replace_assets:
        description: Replace the existing ZIP and checksum using source_ref
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SCIENCELOGO_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SCIENCELOGO_SOURCE_REF: ${{ inputs.source_ref }}
      SCIENCELOGO_REPLACE_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_assets }}

    steps:
      - name: Check rebuild inputs
        shell: bash
        run: |
          if [ "$SCIENCELOGO_REPLACE_ASSETS" = true ]; then
            if [ -z "$SCIENCELOGO_SOURCE_REF" ]; then
              echo "::error::Provide source_ref for the commit or branch to rebuild."
              exit 1
            fi
          elif [ -n "$SCIENCELOGO_SOURCE_REF" ]; then
            echo "::error::Enable replace_assets to rebuild an existing release from source_ref."
            exit 1
          fi

      - name: Check out package source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          persist-credentials: false

      - name: Validate citation metadata
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"

      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          distribution: full
          variant: CS
          version: "9.3"

      - name: Build the release package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sciencelogo"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/sciencelogo"
          raco pkg create --source --format zip --dest "$RUNNER_TEMP" "$RUNNER_TEMP/sciencelogo"

      - name: Install the release package
        run: raco pkg install --auto --batch --scope user "$RUNNER_TEMP/sciencelogo.zip"

      - name: Check release versions
        shell: bash
        run: |
          racket /dev/stdin <<'RACKET'
          #lang racket/base
          (require setup/getinfo version/utils yaml)
          (define package-info (get-info/full (current-directory)))
          (define package-version (package-info 'version (lambda () #f)))
          (unless (and (string? package-version) (valid-version? package-version))
            (error 'release "info.rkt must declare a valid Racket package version"))
          (define citation-version (hash-ref (file->yaml "CITATION.cff") "version" #f))
          (unless (equal? package-version citation-version)
            (error 'release "info.rkt and CITATION.cff must declare the same version"))
          (unless (equal? (getenv "SCIENCELOGO_RELEASE_TAG")
                          (string-append "v" package-version))
            (error 'release "release tag must be v~a" package-version))
          RACKET

      - name: Run Racket tests
        run: |
          git --version
          raco test --jobs 2 --drdr --package sciencelogo

      - name: Test the release package without Git
        shell: bash
        run: |
          racket_executable="$(command -v racket)"
          mkdir -p "$RUNNER_TEMP/without-git"
          PATH="$RUNNER_TEMP/without-git" "$racket_executable" -l- raco test --jobs 2 --drdr --package sciencelogo

      - name: Attach the release package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_metadata="$RUNNER_TEMP/sciencelogo-release.json"
          if ! gh api "repos/$GH_REPO/releases/tags/$SCIENCELOGO_RELEASE_TAG" > "$release_metadata"; then
            if [ "$SCIENCELOGO_REPLACE_ASSETS" = true ]; then
              echo "::error::A package rebuild requires an existing GitHub release."
              exit 1
            fi
            gh release create "$SCIENCELOGO_RELEASE_TAG" --draft --verify-tag \
              --title "ScienceLogo ${SCIENCELOGO_RELEASE_TAG#v}" --generate-notes
            gh api "repos/$GH_REPO/releases/tags/$SCIENCELOGO_RELEASE_TAG" > "$release_metadata"
          fi
          release_url="$(jq -r .html_url "$release_metadata")"
          if [ "$SCIENCELOGO_REPLACE_ASSETS" = true ]; then
            if jq -e .immutable "$release_metadata" > /dev/null; then
              echo "::error::This release is immutable; its package files cannot be replaced."
              exit 1
            fi
            source_commit="$(git rev-parse HEAD)"
            gh release upload "$SCIENCELOGO_RELEASE_TAG" "$RUNNER_TEMP/sciencelogo.zip" --clobber
            gh release upload "$SCIENCELOGO_RELEASE_TAG" "$RUNNER_TEMP/sciencelogo.zip.CHECKSUM" --clobber
            printf 'Package files replaced: %s\n\nSource commit: https://github.com/%s/commit/%s\n\nArchive SHA-1: %s\n' \
              "$release_url" "$GH_REPO" "$source_commit" \
              "$(cat "$RUNNER_TEMP/sciencelogo.zip.CHECKSUM")" >> "$GITHUB_STEP_SUMMARY"
          elif jq -e .draft "$release_metadata" > /dev/null; then
            gh release upload "$SCIENCELOGO_RELEASE_TAG" \
              "$RUNNER_TEMP/sciencelogo.zip" \
              "$RUNNER_TEMP/sciencelogo.zip.CHECKSUM" --clobber
            printf 'Draft release ready: %s\n\nReview the release notes, then publish the draft in GitHub.\n' \
              "$release_url" >> "$GITHUB_STEP_SUMMARY"
          else
            has_asset() {
              jq -e --arg name "$1" 'any(.assets[]; .name == $name)' "$release_metadata" > /dev/null
            }
            missing_assets=()
            for asset in sciencelogo.zip sciencelogo.zip.CHECKSUM; do
              if ! has_asset "$asset"; then
                missing_assets+=("$RUNNER_TEMP/$asset")
              fi
            done
            if [ "${#missing_assets[@]}" -gt 0 ] && jq -e .immutable "$release_metadata" > /dev/null; then
              echo "::error::This published release is immutable; missing package files cannot be attached."
              exit 1
            fi

            existing_directory="$RUNNER_TEMP/published-package"
            mkdir -p "$existing_directory"
            release_archive="$RUNNER_TEMP/sciencelogo.zip"
            if has_asset sciencelogo.zip; then
              gh release download "$SCIENCELOGO_RELEASE_TAG" --pattern sciencelogo.zip --dir "$existing_directory"
              release_archive="$existing_directory/sciencelogo.zip"
            fi
            archive_checksum="$(sha1sum "$release_archive" | cut -d ' ' -f 1)"
            if has_asset sciencelogo.zip.CHECKSUM; then
              gh release download "$SCIENCELOGO_RELEASE_TAG" --pattern sciencelogo.zip.CHECKSUM --dir "$existing_directory"
              existing_checksum="$(tr -d '[:space:]' < "$existing_directory/sciencelogo.zip.CHECKSUM")"
              if [ "$existing_checksum" != "$archive_checksum" ]; then
                echo "::error::The published checksum does not match the package archive; existing files were left unchanged."
                exit 1
              fi
            else
              printf '%s' "$archive_checksum" > "$RUNNER_TEMP/sciencelogo.zip.CHECKSUM"
            fi
            if [ "${#missing_assets[@]}" -gt 0 ]; then
              gh release upload "$SCIENCELOGO_RELEASE_TAG" "${missing_assets[@]}"
            fi
            printf 'Release package files ready: %s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
          fi
